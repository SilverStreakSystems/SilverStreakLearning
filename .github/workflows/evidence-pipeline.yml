name: SSLS Evidence Pipeline

# Generates a current-run evidence set into an ephemeral path, verifies it,
# runs the post-generation output-safety guard, and uploads the generated set
# as a build artefact. The committed evidence tree is never written by CI.
#
# Presence of this workflow is not merge enforcement: branch protection is
# configured outside the repository and is recorded as FND-012.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Generate, verify and publish evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSLS_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence
      SSLS_EPHEMERAL_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence
      SSLS_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the pinned Bun toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies from the frozen lockfile
        run: bun install --frozen-lockfile

      - name: Verify the committed evidence set
        run: SSLS_EVIDENCE_DIR=evidence bun run evidence:verify

      - name: Generate and verify current-run evidence ephemerally
        run: bun run evidence:ephemeral --keep

      - name: Publish the generated evidence set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssls-evidence-${{ github.sha }}
          path: ${{ github.workspace }}/.ci-evidence
          retention-days: 90
          if-no-files-found: error
