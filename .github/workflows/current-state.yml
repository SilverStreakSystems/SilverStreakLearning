name: Current-State Projection

# Verifies that the canonical current-state document is the deterministic
# projection of its declared controlling inputs, that every declared input
# resolves, and that no superseded document presents itself as current.
# Freshness only: this workflow confers no authority, approval, or validation.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-state:
    name: Current-state projection is generated and current
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the current-state projection
        run: bun scripts/gen-current-state.ts --check
